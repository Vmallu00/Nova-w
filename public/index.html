<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>FakePixel AFK Manager</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #080b12;
      --panel: #101521;
      --panel-2: #151b29;
      --border: #252d3d;
      --text: #f4f7fb;
      --muted: #8993a7;
      --primary: #7c5cff;
      --primary-2: #6244e8;
      --green: #28d17c;
      --red: #ff5263;
      --yellow: #f5c451;
      --blue: #42a5ff;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top right,
          rgba(124, 92, 255, 0.16),
          transparent 30%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(66, 165, 255, 0.08),
          transparent 28%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* Login */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: min(420px, 100%);
      background: rgba(16, 21, 33, 0.96);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 30px;
      box-shadow:
        0 25px 80px rgba(0, 0, 0, 0.45);
    }

    .logo {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          var(--primary),
          #a98cff
        );
      font-size: 25px;
      font-weight: 900;
      margin-bottom: 18px;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .login-card h1 {
      margin-bottom: 8px;
      font-size: 25px;
    }

    .muted {
      color: var(--muted);
    }

    .login-card .muted {
      margin-bottom: 25px;
    }

    /* Layout */

    #app {
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      background: rgba(8, 11, 18, 0.9);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(15px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800;
    }

    .brand-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--primary);
      font-size: 18px;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .container {
      width: min(1450px, 100%);
      margin: 0 auto;
      padding: 24px;
    }

    /* Buttons */

    .btn {
      border: 1px solid var(--border);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 13px;
      transition: 0.15s ease;
    }

    .btn:hover {
      border-color: #3a455b;
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--primary);
      border-color: var(--primary);
    }

    .btn.primary:hover {
      background: var(--primary-2);
    }

    .btn.success {
      color: white;
      background: #137b4c;
      border-color: #137b4c;
    }

    .btn.danger {
      color: white;
      background: #9e2c3b;
      border-color: #9e2c3b;
    }

    .btn.small {
      padding: 7px 10px;
      font-size: 13px;
    }

    /* Stats */

    .stats {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 27px;
      font-weight: 800;
    }

    /* Toolbar */

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .toolbar h2 {
      margin: 0;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Bot grid */

    .bot-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(330px, 1fr));
      gap: 16px;
    }

    .bot-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      min-width: 0;
    }

    .bot-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 15px;
    }

    .bot-name {
      font-size: 18px;
      font-weight: 800;
      word-break: break-word;
    }

    .bot-id {
      color: var(--muted);
      font-size: 11px;
      margin-top: 4px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.online,
    .status.afk {
      color: var(--green);
      background: rgba(40, 209, 124, 0.1);
    }

    .status.offline,
    .status.stopped {
      color: var(--red);
      background: rgba(255, 82, 99, 0.1);
    }

    .status.connecting,
    .status.reconnecting {
      color: var(--yellow);
      background: rgba(245, 196, 81, 0.1);
    }

    .status.error {
      color: var(--red);
      background: rgba(255, 82, 99, 0.1);
    }

    .status.ready,
    .status.visiting {
      color: var(--blue);
      background: rgba(66, 165, 255, 0.1);
    }

    .info-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .info {
      background: rgba(255, 255, 255, 0.025);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 10px;
      padding: 9px;
      min-width: 0;
    }

    .info-label {
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .info-value {
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .bot-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .bot-actions .btn {
      flex: 1;
      min-width: 75px;
    }

    .empty {
      padding: 60px 20px;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 18px;
      color: var(--muted);
    }

    /* Panel sections */

    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .section-title h3 {
      margin: 0;
    }

    /* Forms */

    .form-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: #b9c1d0;
      font-size: 13px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--border);
      background: #0b0f18;
      color: var(--text);
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: var(--primary);
    }

    .form-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    /* Modal */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.72);
    }

    .modal-card {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-head h3 {
      margin: 0;
    }

    /* Console */

    .console {
      height: 330px;
      overflow: auto;
      background: #05070b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      font-family:
        "SFMono-Regular",
        Consolas,
        monospace;
      font-size: 12px;
      line-height: 1.6;
    }

    .log-line {
      border-bottom: 1px solid rgba(255,255,255,0.03);
      padding: 2px 0;
      word-break: break-word;
    }

    .log-time {
      color: #667085;
    }

    /* Toast */

    #toastContainer {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: min(360px, calc(100vw - 36px));
    }

    .toast {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.35);
      font-size: 13px;
    }

    .toast.error {
      border-color: #7e2936;
    }

    .toast.success {
      border-color: #216f4b;
    }

    /* Responsive */

    @media (max-width: 800px) {
      .stats {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .topbar {
        padding: 0 14px;
      }

      .container {
        padding: 14px;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .stat {
        padding: 13px;
      }

      .stat-value {
        font-size: 22px;
      }

      .bot-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        height: 62px;
      }

      .brand span {
        display: none;
      }

      .toolbar-actions {
        width: 100%;
      }

      .toolbar-actions .btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <div id="toastContainer"></div>


<script>
"use strict";

let token =
  localStorage.getItem(
    "fakepixel_token"
  );

let bots = [];

let settings = {};

let logTimer = null;

let selectedLogBot = null;


// --------------------------------------------------
// API
// --------------------------------------------------

async function api(
  url,
  options = {}
) {
  const headers = {
    "Content-Type":
      "application/json",
    ...(options.headers || {})
  };

  if (token) {
    headers.Authorization =
      `Bearer ${token}`;
  }

  const response =
    await fetch(
      url,
      {
        ...options,
        headers
      }
    );

  let data = {};

  try {
    data =
      await response.json();
  } catch (_) {
    data = {};
  }

  if (
    response.status === 401
  ) {
    logout(false);
    throw new Error(
      "Session expired."
    );
  }

  if (
    !response.ok ||
    data.success === false
  ) {
    throw new Error(
      data.error ||
      `Request failed (${response.status})`
    );
  }

  return data;
}


// --------------------------------------------------
// Toast
// --------------------------------------------------

function toast(
  message,
  type = "success"
) {
  const container =
    document.getElementById(
      "toastContainer"
    );

  const item =
    document.createElement(
      "div"
    );

  item.className =
    `toast ${type}`;

  item.textContent =
    message;

  container.appendChild(
    item
  );

  setTimeout(() => {
    item.remove();
  }, 3500);
}


// --------------------------------------------------
// Login
// --------------------------------------------------

document
  .getElementById(
    "loginForm"
  )
  .addEventListener(
    "submit",
    async event => {
      event.preventDefault();

      const username =
        document.getElementById(
          "loginUsername"
        ).value;

      const password =
        document.getElementById(
          "loginPassword"
        ).value;

      try {
        const result =
          await fetch(
            "/api/login",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              },
              body:
                JSON.stringify({
                  username,
                  password
                })
            }
          );

        const data =
          await result.json();

        if (
          !result.ok ||
          !data.success
        ) {
          throw new Error(
            data.error ||
            "Login failed."
          );
        }

        token =
          data.token;

        localStorage.setItem(
          "fakepixel_token",
          token
        );

        showApp();

      } catch (error) {
        toast(
          error.message,
          "error"
        );
      }
    }
  );


// --------------------------------------------------
// Authentication
// --------------------------------------------------

async function checkSession() {
  if (!token) {
    showLogin();
    return;
  }

  try {
    await loadDashboard();
    showApp();

    .getElementById(

async function logout(
  notify = true
) {
  try {
    if (token) {
      await api(
        "/api/logout",
        {
          method: "POST"
        }
      );
    }
  } catch (_) {}

  token = null;

  localStorage.removeItem(
    "fakepixel_token"

async function loadDashboard() {
  const data =
    await api(
      "/api/dashboard"
    );

  bots =
    data.bots || [];

  settings =
    data.settings || {};

  render();
}

function render() {
  renderStats();
  renderBots();
}

function renderStats() {
  const total =
    bots.length;

  const online =
    bots.filter(
      bot =>
        [
          "online",
          "afk",
          "visiting",
          "ready"
        ].includes(
          String(
            bot.status
          ).toLowerCase()
        )
    ).length;

  const afk =
    bots.filter(
      bot =>
        String(
          bot.status
        ).toLowerCase() ===
        "afk"
    ).length;

  const reconnecting =
    bots.filter(
      bot =>
        String(
          bot.status
        ).toLowerCase() ===
        "reconnecting"
    ).length;

  document
    .getElementById(
      "statTotal"
    )
    .textContent =
    total;

  document
    .getElementById(
      "statOnline"
    )
    .textContent =
    online;

  document
    .getElementById(
      "statAfk"
    )
    .textContent =
    afk;

  document
    .getElementById(
      "statReconnect"
    )
    .textContent =
    reconnecting;
}


// --------------------------------------------------
// Bot rendering
// --------------------------------------------------

function escapeHtml(
  value
) {
  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}

function statusClass(
  status
) {
  const value =
    String(
      status || "offline"
    ).toLowerCase();

  return [
    "online",
    "afk",
    "offline",
    "stopped",
    "connecting",
    "reconnecting",
    "error",
    "ready",
    "visiting"
  ].includes(value)
    ? value
    : "offline";
}

function formatUptime(
  seconds
) {
  const total =
    Math.max(
      0,
      Number(seconds || 0)
    );

  const hours =
    Math.floor(
      total / 3600
    );

  const minutes =
    Math.floor(
      (total % 3600) / 60
    );

  const secs =
    Math.floor(
      total % 60
    );

  return `${hours}h ${minutes}m ${secs}s`;
}

function formatPosition(
  position
) {
  if (!position) {
    return "—";
  }

  const x =
    Number(position.x);

  const y =
    Number(position.y);

  const z =
    Number(position.z);

  if (
    !Number.isFinite(x) ||
    !Number.isFinite(y) ||
    !Number.isFinite(z)
  ) {
    return "—";
  }

  return `${x.toFixed(1)}, ${y.toFixed(1)}, ${z.toFixed(1)}`;
}

function renderBots() {
  const grid =
    document.getElementById(
      "botGrid"
    );

  if (!bots.length) {
    grid.innerHTML = `
      <div class="empty">
        <h3>No bots configured</h3>
        <p>
          Add your first FakePixel Minecraft bot.
        </p>
        <button
          class="btn primary"
          onclick="openAddBot()"
        >
          + Add Bot
        </button>
      </div>
    `;

    return;
  }

  grid.innerHTML =
    bots.map(
      bot => `
        <article class="bot-card">

          <div class="bot-head">

            <div>
              <div class="bot-name">
                ${escapeHtml(
                  bot.username
                )}
              </div>

              <div class="bot-id">
                ID:
                ${escapeHtml(
                  bot.id
                )}
              </div>
            </div>

            <span
              class="status ${statusClass(
                bot.status
              )}"
            >
              ${escapeHtml(
                bot.status ||
                "offline"
              )}
            </span>

          </div>

          <div class="info-grid">

            <div class="info">
              <div class="info-label">
                Target
              </div>

              <div class="info-value">
                ${escapeHtml(
                  bot.target ||
                  "—"
                )}
              </div>
            </div>

            <div class="info">
              <div class="info-label">
                State
              </div>

              <div class="info-value">
                ${escapeHtml(
                  bot.flow ||
                  "idle"
                )}
              </div>
            </div>

            <div class="info">
              <div class="info-label">
                Uptime
              </div>

              <div class="info-value">
                ${formatUptime(
                  bot.uptime
                )}
              </div>
            </div>

            <div class="info">
              <div class="info-label">
                Position
              </div>

              <div class="info-value">
                ${formatPosition(
                  bot.position
                )}
              </div>
            </div>

            <div class="info">
              <div class="info-label">
                Duration
              </div>

              <div class="info-value">
                ${escapeHtml(
                  bot.durationHours ||
                  "—"
                )} h
              </div>
            </div>

            <div class="info">
              <div class="info-label">
                Reconnect
              </div>

              <div class="info-value">
                ${
                  bot.autoReconnect
                    ? "Enabled"
                    : "Disabled"
                }
              </div>
            </div>

          </div>

          <div class="bot-actions">

            <button
              class="btn success small"
              onclick="botAction(
                '${escapeJs(bot.id)}',
                'start'
              )"
            >
              Start
            </button>

            <button
              class="btn danger small"
              onclick="botAction(
                '${escapeJs(bot.id)}',
                'stop'
              )"
            >
              Stop
            </button>

            <button
              class="btn small"
              onclick="botAction(
                '${escapeJs(bot.id)}',
                'restart'
              )"
            >
              Restart
            </button>

            <button
              class="btn small"
              onclick="botAction(
                '${escapeJs(bot.id)}',
                'rejoin'
              )"
            >
              Rejoin
            </button>

            <button
              class="btn small"
              onclick="showLogs(
                '${escapeJs(bot.id)}',
                '${escapeJs(bot.username)}'
              )"
            >
              Logs
            </button>

            <button
              class="btn small"
              onclick="openEditBot(
                '${escapeJs(bot.id)}'
              )"
            >
              Edit
            </button>

            <button
              class="btn danger small"
              onclick="deleteBot(
                '${escapeJs(bot.id)}'
              )"
            >
              Delete
            </button>

          </div>

        </article>
      `
    ).join("");
}

function escapeJs(
  value
) {
  return String(
    value ?? ""
  )
    .replaceAll(
      "\\",
      "\\\\"
    )
    .replaceAll(
      "'",
      "\\'"
    );
}

async function showLogs(
  id,
  username
) {
  selectedLogBot =
    id;

  document
    .getElementById(
      "logsTitle"
    )
    .textContent =
    `${username} — Console`;

  document
    .getElementById(
      "logsModal"
    )
    .classList.remove(
      "hidden"
    );

  await loadLogs();

  if (logTimer) {
    clearInterval(
      logTimer
    );
  }

  logTimer =
    setInterval(
      loadLogs,
      2500
    );
}

async function loadLogs() {
  if (
    !selectedLogBot ||
    !token
  ) {
    return;
  }

  try {
    const data =
      await api(
        `/api/bots/${encodeURIComponent(
          selectedLogBot
        )}/logs`
      );

    const logs =
      data.logs || [];

    const consoleElement =
      document.getElementById(
        "console"
      );

    consoleElement.innerHTML =
      logs.map(
        item => `
          <div class="log-line">
            <span class="log-time">
              ${escapeHtml(
                item.time ||
                ""
              )}
            </span>
            ${escapeHtml(
              item.message ||
              item
            )}
          </div>
        `
      ).join("");

    consoleElement.scrollTop =
      consoleElement.scrollHeight;

  } catch (_) {}
}

// --------------------------------------------------
// Edit bot
// --------------------------------------------------

async function openEditBot(
  id
) {
  const bot =
    bots.find(
      item =>
        item.id === id
    );

  if (!bot) {
    return;
  }

  const target =
    prompt(
      "Target username:",
      bot.target || ""
    );

  if (target === null) {
    return;
  }

  const duration =
    prompt(
      "Duration in hours:",
      bot.durationHours || 2
    );

  if (duration === null) {
    return;
  }

  const moveInterval =
    prompt(
      "Move interval in milliseconds:",
      bot.moveInterval || 8000
    );

  if (
    moveInterval === null
  ) {
    return;
  }

  const jumpInterval =
    prompt(
      "Jump interval in milliseconds:",
      bot.jumpInterval || 15000
    );

  if (
    jumpInterval === null
  ) {
    return;
  }

  try {
    await api(
      `/api/bots/${encodeURIComponent(
        id
      )}/config`,
      {
        method: "PUT",
        body:
          JSON.stringify({
            target,
            durationHours:
              Number(duration),
            moveInterval:
              Number(moveInterval),
            jumpInterval:
              Number(jumpInterval)
          })
      }
    );

    toast(
      "Bot configuration updated."
    );

    await loadDashboard();

  } catch (error) {
    toast(
      error.message,
      "error"
    );
  }
}

function closeModal(
  id
) {
  document
    .getElementById(id)
    .classList.add(
      "hidden"
    );

  if (
    id === "logsModal"
  ) {
    selectedLogBot = null;

    if (logTimer) {
      clearInterval(
        logTimer
      );

      logTimer = null;
    }
  }
}
